name: Protocol Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    name: 12-Rule Ceremony Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run protocol lint (all 12 rules, incl. ledger wiring)
        run: bash scripts/protocol-lint.sh
