name: Protocol Lint

on:
  push:
    branches: [main, dev]
    paths:
      - "*.md"
      - "docs/**"
      - "scripts/**"
      - ".omo/**"
      - ".github/workflows/protocol-lint.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "*.md"
      - "docs/**"
      - "scripts/**"
      - ".omo/**"

jobs:
  lint:
    name: 7-Rule Ceremony Check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4

      - name: Run protocol lint
        run: bash scripts/protocol-lint.sh
