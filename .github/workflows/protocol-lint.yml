name: Protocol Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    name: 9-Rule Ceremony Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run protocol lint (includes Rule 8/9 hygiene and ledger wiring)
        run: bash scripts/protocol-lint.sh

      - name: Wire ledger-check evidence gate
        run: python3 scripts/ledger-check.py
